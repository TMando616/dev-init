services:
  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - node

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # DB_CONNECTION / DB_DATABASE はここで OS 環境変数として注入しない。
      # 注入すると phpunit.xml / .env の sqlite 設定を上書きしてしまい、
      # `artisan test` が開発用 pgsql を RefreshDatabase で破壊するため。
      # 接続先は backend/.env（実行時）と phpunit.xml（テスト時）で解決する。
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DOCKER_HOST_PATH: ${PWD}/backend/storage/app/temp_code

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api"
    command: npx next dev --webpack -H 0.0.0.0
    tty: true
    stdin_open: true
    # Ensure node_modules is not overwritten by host
    restart: always

  # 開発用のメール受信箱。送信されたメールは外部に出ず、Web UI で確認する。
  # php サービスから depends_on は張らない（メールが送れなくてもアプリは起動すべきなので、
  # 起動順序の結合を作らない）。
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # スケジューラ（users:purge-deleted の日次実行）。
  # profiles を付けて opt-in にしてある。`docker compose up` の副作用で
  # 開発DBの退会済みユーザーが物理削除されるのを防ぐため。
  # 起動: docker compose --profile scheduler up scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    command: php artisan schedule:work
    depends_on:
      - db
    profiles: ["scheduler"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-devinit}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"

volumes:
  db-data:
